name: Google News front-page snapshot

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Collect even when this three-hour slot already exists"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub Actions cron is UTC. The collector itself buckets by UTC time;
    # the dashboard can display the stored ISO timestamp in local time.
    - cron: "7 */3 * * *"

permissions:
  contents: write

concurrency:
  group: google-news-frontpage
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect front-page snapshot
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python -m src.frontpage --data-dir data --force
          else
            python -m src.frontpage --data-dir data
          fi

      - name: Commit snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news
          if git diff --cached --quiet; then
            echo "No new snapshot in this three-hour slot."
          else
            git commit -m "data: Google News snapshot $(date -u +'%Y-%m-%dT%H:%MZ')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
