# Feeds RSS curados + tabela de autoridade por domínio.
#
# Adicionar/remover fonte = editar aqui, sem tocar em código.
# - authority_score (0-100): peso da fonte no trend score e na verificação.
# - domain: domínio onde as MATÉRIAS vivem (nem sempre o host do feed).
# - vertical_hint: sugere vertical ao router (opcional; categoria já mapeia
#   entertainment->entertainment, politics->politics, science/technology->facts).
# - enabled: false desliga a fonte sem apagar a configuração.

sources:
  # ── Brasil: geral ────────────────────────────────────────────────
  - source_name: G1
    url: https://g1.globo.com/rss/g1/
    domain: g1.globo.com
    category: general
    authority_score: 85
    language: pt
    country: BR
    enabled: true

  - source_name: Agência Brasil
    url: https://agenciabrasil.ebc.com.br/rss/ultimasnoticias/feed.xml
    domain: agenciabrasil.ebc.com.br
    category: general
    authority_score: 88
    language: pt
    country: BR
    enabled: true

  - source_name: Folha de S.Paulo
    url: https://feeds.folha.uol.com.br/emcimadahora/rss091.xml
    domain: folha.uol.com.br
    category: general
    authority_score: 85
    language: pt
    country: BR
    enabled: true

  - source_name: BBC News Brasil
    url: https://feeds.bbci.co.uk/portuguese/rss.xml
    domain: bbc.com
    category: general
    authority_score: 86
    language: pt
    country: BR
    enabled: true

  # ── Brasil: política ─────────────────────────────────────────────
  - source_name: Poder360
    url: https://www.poder360.com.br/feed/
    domain: poder360.com.br
    category: politics
    authority_score: 78
    language: pt
    country: BR
    enabled: true

  - source_name: Agência Câmara
    url: https://www.camara.leg.br/noticias/rss
    domain: camara.leg.br
    category: official
    authority_score: 95
    language: pt
    country: BR
    vertical_hint: politics
    enabled: false   # TODO: confirmar URL exata do feed antes de ligar

  - source_name: Agência Senado
    url: https://www12.senado.leg.br/noticias/feed
    domain: senado.leg.br
    category: official
    authority_score: 95
    language: pt
    country: BR
    vertical_hint: politics
    enabled: false   # TODO: confirmar URL exata do feed antes de ligar

  # ── Entretenimento ───────────────────────────────────────────────
  - source_name: Variety
    url: https://variety.com/feed/
    domain: variety.com
    category: entertainment
    authority_score: 80
    language: en
    country: US
    enabled: true

  - source_name: The Hollywood Reporter
    url: https://www.hollywoodreporter.com/feed/
    domain: hollywoodreporter.com
    category: entertainment
    authority_score: 80
    language: en
    country: US
    enabled: true

  - source_name: Billboard
    url: https://www.billboard.com/feed/
    domain: billboard.com
    category: entertainment
    authority_score: 78
    language: en
    country: US
    enabled: true

  - source_name: Deadline
    url: https://deadline.com/feed/
    domain: deadline.com
    category: entertainment
    authority_score: 78
    language: en
    country: US
    enabled: true

  - source_name: Rolling Stone Brasil
    url: https://rollingstone.com.br/feed/
    domain: rollingstone.com.br
    category: entertainment
    authority_score: 70
    language: pt
    country: BR
    enabled: true

  - source_name: Omelete
    url: https://www.omelete.com.br/rss
    domain: omelete.com.br
    category: entertainment
    authority_score: 65
    language: pt
    country: BR
    enabled: false   # TODO: confirmar URL exata do feed antes de ligar

  # ── Ciência / Fatos ──────────────────────────────────────────────
  - source_name: NASA Breaking News
    url: https://www.nasa.gov/rss/dyn/breaking_news.rss
    domain: nasa.gov
    category: official
    authority_score: 95
    language: en
    country: US
    vertical_hint: facts
    enabled: true

  - source_name: ScienceDaily
    url: https://www.sciencedaily.com/rss/all.xml
    domain: sciencedaily.com
    category: science
    authority_score: 80
    language: en
    country: US
    enabled: true

  - source_name: Phys.org
    url: https://phys.org/rss-feed/
    domain: phys.org
    category: science
    authority_score: 78
    language: en
    country: US
    enabled: true

  - source_name: Live Science
    url: https://www.livescience.com/feeds/all
    domain: livescience.com
    category: science
    authority_score: 72
    language: en
    country: US
    enabled: true

  - source_name: Smithsonian Magazine
    url: https://www.smithsonianmag.com/rss/latest_articles/
    domain: smithsonianmag.com
    category: science
    authority_score: 80
    language: en
    country: US
    enabled: true

  - source_name: Superinteressante
    url: https://super.abril.com.br/feed/
    domain: super.abril.com.br
    category: science
    authority_score: 70
    language: pt
    country: BR
    enabled: true

